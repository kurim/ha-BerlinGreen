blueprint:
  name: GreenBox – Erntereif melden / Harvest ready
  description: >-
    Schickt eine Push-Nachricht an die Home-Assistant-App, sobald ein Pflanztopf oder ein Microgreens-Feld erntereif wird
    (Ereignis `greenbox_harvest_ready` der Integration). / Sends a push notification to the Home Assistant app when a pot or
    microgreens field becomes ready to harvest.
  domain: automation
  source_url: https://github.com/kurim/ha-BerlinGreen/blob/main/blueprints/automation/greenbox/harvest_ready.yaml
  input:
    notify_device:
      name: Handy / Mobile device
      description: Gerät mit der Home-Assistant-App. / Device running the Home Assistant app.
      selector:
        device:
          integration: mobile_app
    title:
      name: Titel / Title
      default: "GreenBox: Ernte"
      selector:
        text: {}
    message:
      name: Text / Message
      description: >-
        Vorlage. Verfügbar: `plant`, `box_name`, `slot` (ab 1), `area` (plants, microgreens oder mushrooms) und `where` (fertiger Ortstext).
      default: >-
        {{ plant }} ist erntereif ({{ box_name }}{{ ', ' ~ where if where else '' }}).
      selector:
        text:
          multiline: true

mode: queued
max_exceeded: silent

variables:
  # auch beim manuellen Ausführen (ohne Ereignis) ohne Fehler
  data: "{{ trigger.event.data if trigger is defined and trigger.event is defined else {} }}"
  plant: "{{ data.plant or 'Pflanze' }}"
  box_name: "{{ data.box_name or 'GreenBox' }}"
  slot: "{{ data.slot }}"
  area: "{{ data.area }}"
  where: >-
    {% if not data.slot %}{% elif data.area == 'mushrooms' %}Pilz{% elif data.area == 'microgreens' %}Microgreens-Feld {{ data.slot }}{% else %}Slot {{ data.slot }}{% endif %}

triggers:
  - trigger: event
    event_type: greenbox_harvest_ready

actions:
  - device_id: !input notify_device
    domain: mobile_app
    type: notify
    title: !input title
    message: !input message
