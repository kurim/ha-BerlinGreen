blueprint:
  name: GreenBox – Wasserstand kritisch / Water level critical
  description: >-
    Schickt eine Push-Nachricht an die Home-Assistant-App, wenn der Wasserstand einer GreenBox niedrig oder leer ist.
    Wähle den Binärsensor „Wasser knapp“ der Box. / Sends a push notification when a GreenBox water level is low or empty.
    Choose the box's "Water low" binary sensor.
  domain: automation
  source_url: https://github.com/kurim/ha-BerlinGreen/blob/main/blueprints/automation/greenbox/water_low.yaml
  input:
    water_low:
      name: Sensor „Wasser knapp“ / "Water low" sensor
      selector:
        entity:
          filter:
            - integration: greenbox
              domain: binary_sensor
              device_class: problem
    notify_device:
      name: Handy / Mobile device
      selector:
        device:
          integration: mobile_app
    title:
      name: Titel / Title
      default: "GreenBox: Wasser"
      selector:
        text: {}
    message:
      name: Text / Message
      description: "Vorlage. Verfügbar: `sensor_name` und `status` (`low` oder `empty`)."
      default: >-
        {{ sensor_name }}: Wasser {{ 'ist leer' if status == 'empty' else 'wird knapp' }} – bitte nachfüllen.
      selector:
        text:
          multiline: true

mode: single

variables:
  entity: !input water_low
  sensor_name: "{{ state_attr(entity, 'friendly_name') or entity }}"
  status: "{{ state_attr(entity, 'status') }}"

triggers:
  - trigger: state
    entity_id: !input water_low
    to: "on"

actions:
  - device_id: !input notify_device
    domain: mobile_app
    type: notify
    title: !input title
    message: !input message
